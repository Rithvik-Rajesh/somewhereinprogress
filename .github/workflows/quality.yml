name: Quality Checks

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run ESLint
        run: bun run lint

      - name: Run Type Check
        run: bunx tsc --noEmit

      - name: Verify Build
        run: bun run build